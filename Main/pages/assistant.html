<!-- Ask LINAW page content loaded into the book. -->
<div class="eyebrow">A FRIENDLY HELPER</div>
<h2>Ask LINAW</h2>
<p class="page-lead">Ask a question about your documents. Lumen AI answers here.</p>
<div class="chat-paper" id="chatMessages" role="log" aria-label="LINAW conversation" aria-live="polite" aria-relevant="additions"></div>
<form id="chatForm" class="chat-form">
  <input id="chatInput" class="paper-input" type="text" aria-label="Write a question" aria-describedby="chatCounter" placeholder="Write a question..." autocomplete="off" />
  <button class="send-button" id="chatSend" type="submit" aria-label="Send message">➤</button>
</form>
<p class="tiny-note"><span id="chatCounter">0 / 250 words</span> <span id="chatStatus" role="status" aria-live="polite"></span></p>
